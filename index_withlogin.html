<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监管局内部管理系统</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 优化的色彩系统 */
            --primary: #2c3e50;
            --primary-light: #34495e;
            --secondary: #3498db;
            --secondary-light: #5dade2;
            --accent: #1abc9c;
            --accent-light: #2ecc71;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --text-tertiary: #95a5a6;
            --border: #ecf0f1;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-fast: 0.2s ease;
            --transition-base: 0.3s ease;
            --transition-slow: 0.4s ease;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        /* 移除之前的背景装饰 */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== 顶部导航栏 ==================== */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.9);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 6px;
            position: relative;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            transition: background-color var(--transition-fast);
            cursor: pointer;
        }

        .user-info:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 15px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .notification {
            position: relative;
            padding: 8px;
            border-radius: 50%;
            transition: background-color var(--transition-fast);
            cursor: pointer;
        }

        .notification:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .notification-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background-color: #e74c3c;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* ==================== 主菜单区域 ==================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 0 24px;
        }

        /* 一级菜单 */
        .system-nav {
            margin: 24px 0 0;
            padding: 0;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .system-nav::-webkit-scrollbar {
            display: none;
        }

        .system-menu {
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-base);
            white-space: nowrap;
            position: relative;
        }

        .system-menu:hover {
            color: var(--primary);
        }

        .system-menu.active {
            color: var(--secondary);
            border-bottom-color: var(--secondary);
        }

        .system-menu.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 24px;
            right: 24px;
            height: 2px;
            background: var(--secondary);
            border-radius: 1px;
        }

        /* 二级菜单 */
        .sub-nav {
            padding: 20px 0;
            display: flex;
            gap: 12px;
        }

        .sub-menu {
            padding: 10px 20px;
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            font-weight: 500;
        }

        .sub-menu:hover {
            color: var(--secondary);
            border-color: var(--secondary);
            transform: translateY(-1px);
        }

        .sub-menu.active {
            color: white;
            background: var(--secondary);
            border-color: var(--secondary);
            box-shadow: var(--shadow-sm);
        }

        /* ==================== 内容区域 ==================== */
        .content-section {
            flex: 1;
            padding: 20px 0 40px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 功能卡片 */
        .feature-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .feature-card:hover {
            border-color: var(--secondary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            transform: scaleX(0);
            transition: transform var(--transition-base);
            transform-origin: left;
        }

        .feature-card:hover::before {
            transform: scaleX(1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: linear-gradient(135deg, var(--secondary-light), var(--secondary));
            color: white;
            flex-shrink: 0;
            transition: transform var(--transition-base);
        }

        .feature-card:hover .card-icon {
            transform: rotate(8deg) scale(1.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            line-height: 1.4;
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 8px;
            flex: 1;
        }

        /* card-footer and status badges removed per design update */

        /* ==================== 空状态 ==================== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-text {
            font-size: 16px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .header {
                height: 60px;
                padding: 0 16px;
            }

            .main-content {
                padding: 0 16px;
            }

            .system-nav {
                margin-top: 16px;
                gap: 4px;
            }

            .system-menu {
                padding: 12px 16px;
                font-size: 14px;
            }

            .sub-nav {
                padding: 16px 0;
                gap: 8px;
                flex-wrap: wrap;
            }

            .sub-menu {
                padding: 8px 16px;
                font-size: 13px;
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .feature-card {
                padding: 24px;
            }

            .card-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .user-name {
                display: none;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        /* ==================== 用户菜单 ==================== */
        .user-menu {
            position: absolute;
            top: 56px;
            right: 16px;
            background: var(--surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            min-width: 160px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all var(--transition-base);
            z-index: 1001;
        }

        .user-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-menu-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: background-color var(--transition-fast);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu-item:last-child {
            border-bottom: none;
        }

        .user-menu-item:hover {
            background-color: rgba(0, 0, 0, 0.03);
            color: var(--secondary);
        }

        .user-menu-item::before {
            content: '→';
            font-size: 12px;
            opacity: 0.5;
        }

        /* ==================== 滚动条美化 ==================== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* ==================== 加载动画 ==================== */
        .content-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--secondary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <div class="header">

                    </svg>
                    <span class="notification-badge"></span>
                </div>
                <div class="user-info" id="userInfo">
                    <div class="user-avatar" id="userAvatar">登</div>
                    <div class="user-name" id="userName">登录</div>
                </div>
            </div>
            
            <!-- 用户菜单 (已登录时显示) -->
            <div class="user-menu" id="userMenu">
                <div class="user-menu-item" id="logoutBtn">退出登录</div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 一级菜单 -->
            <div class="system-nav" id="systemNav">
                <div class="system-menu active" data-system="approval">行政审批事项内部审查系统</div>
                <div class="system-menu" data-system="task">工作任务管理系统</div>
                <div class="system-menu" data-system="supervision">非现场监管系统</div>
            </div>

            <!-- 二级菜单（动态渲染） -->
            <div class="sub-nav" id="subNav"></div>

            <!-- 内容区域 -->
            <div class="content-section">
                <div class="content-grid" id="contentGrid">
                    <!-- 功能卡片将通过JavaScript动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 登录状态管理
        let isLoggedIn = false;
        const LOGIN_KEY = 'regulatory_login_status';
        const LOGIN_USERNAME_KEY = 'regulatory_username';
        const LOGIN_AVATAR_TEXT_KEY = 'regulatory_avatar_text';
        
        // 初始化登录状态
        function initLoginStatus() {
            const loginStatus = localStorage.getItem(LOGIN_KEY);
            isLoggedIn = loginStatus === 'true';
            
            if (isLoggedIn) {
                // 从localStorage获取用户信息
                const username = localStorage.getItem(LOGIN_USERNAME_KEY) || '管理员';
                const avatarText = localStorage.getItem(LOGIN_AVATAR_TEXT_KEY) || '管';
                
                // 更新UI显示
                document.getElementById('userName').textContent = username;
                document.getElementById('userAvatar').textContent = avatarText;
                
                // 显示用户菜单
                setupLoggedInMenu();
            } else {
                // 未登录状态
                document.getElementById('userName').textContent = '登录';
                document.getElementById('userAvatar').textContent = '登';
                
                // 隐藏用户菜单
                document.getElementById('userMenu').style.display = 'none';
                
                // 设置点击跳转到登录页
                setupLoginRedirect();
            }
        }
        
        // 设置已登录状态的菜单
        function setupLoggedInMenu() {
            const userInfo = document.getElementById('userInfo');
            const userMenu = document.getElementById('userMenu');
            
            // 显示用户菜单
            userMenu.style.display = '';
            
            // 点击头像显示/隐藏菜单
            userInfo.addEventListener('click', function(e) {
                e.stopPropagation();
                userMenu.classList.toggle('show');
            });
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', function() {
                userMenu.classList.remove('show');
            });
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function() {
                logout();
            });
        }
        
        // 设置未登录状态的跳转
        function setupLoginRedirect() {
            const userInfo = document.getElementById('userInfo');
            
            userInfo.addEventListener('click', function() {
                // 跳转到登录页面
                window.location.href = '/magicflu/html/sites/userfiles/050af23a-90c9-4169-a182-cdf755e7a3a4/login.html';
            });
        }
        
        // 退出登录函数
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 清除登录状态
                localStorage.removeItem(LOGIN_KEY);
                localStorage.removeItem(LOGIN_USERNAME_KEY);
                localStorage.removeItem(LOGIN_AVATAR_TEXT_KEY);
                
                // 刷新页面以更新状态
                window.location.reload();
            }
        }
        
        // 模拟登录函数（实际应由登录页面调用）
        function simulateLogin(username, avatarText) {
            // 设置登录状态
            localStorage.setItem(LOGIN_KEY, 'true');
            localStorage.setItem(LOGIN_USERNAME_KEY, username);
            localStorage.setItem(LOGIN_AVATAR_TEXT_KEY, avatarText);
            
            // 刷新页面

                subNav.innerHTML = '';
                const items = submenuConfig[system] || [];

                    const el = document.createElement('div');

                    subNav.appendChild(el);
                });

        // 加载详细视图
        function loadDetailView(system) {
            const contentGrid = document.getElementById('contentGrid');
            
            // 显示加载状态
            contentGrid.innerHTML = `
                <div class="content-loading">
                    <div class="spinner"></div>
                </div>
            `;
            
            // 模拟加载延迟，使过渡更自然
            setTimeout(() => {
                // 获取功能点数据
                const functions = functionData[system] || [];
                
                if (functions.length === 0) {
                    contentGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <div class="empty-text">暂无功能点</div>
                        </div>
                    `;
                    return;
                }
                
                // 清空并重新填充内容
                contentGrid.innerHTML = '';
                
                // 创建功能卡片
                functions.forEach((func, index) => {
                    const card = document.createElement('div');
                    card.className = 'feature-card';
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-icon">${func.icon}</div>
                            <div>
                                <div class="card-title">${func.title}</div>
                            </div>
                        </div>
                        <div class="card-description">${func.desc}</div>
                    `;
                    
                    card.addEventListener('click', function() {
                        // 添加点击反馈
                        this.style.transform = 'translateY(-2px) scale(0.99)';
                        setTimeout(() => {
                            this.style.transform = '';
                        }, 200);
                        
                        if (func.link) {

                            console.warn(`功能"${func.title}"未配置跳转链接。`);
                        }
                    });
                    
                    contentGrid.appendChild(card);
                });
            }, 300); // 300ms的延迟，使加载更自然
